[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1"

[window]
dynamic_padding = true
decorations = "full"
decorations_theme_variant = "Dark"
title = "Alacritty"
option_as_alt = "Both"

[window.dimensions]
columns = 100
lines = 30

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 100_000
multiplier = 3

[font]
size = 12.0
normal = {family = "JetBrainsMono Nerd Font", style = "Regular"}

[cursor]
vi_mode_style = "Block"
style = {blinking = "Off", shape = "Beam"}
unfocused_hollow = true
thickness = 0.15

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
  {action = "SpawnNewInstance", key = "Return", mods = "Control|Shift"} ,
]

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

[general]
live_config_reload = true

# Catppuccin Mocha
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
cursor = "#f5e0dc"
text = "#1e1e2e"

[colors.selection]
background = "#585b70"
text = "CellForeground"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"
